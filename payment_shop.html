<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100..900&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Sora:wght@100..800&family=Syne:wght@400..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>asg1</title>

    
    <link href="normalize.css" rel="stylesheet" type="text/css" />
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>

    <h1 class="page-title" id="payment-head">Payment</h1>
    
    <section class="item-information-purchase">
      <h2 id="total-payable"></h2>
      <form id="payment-details-form">
        
        <div>
          <label for="email">Contact:</label>
          <input type="text" id="email" placeholder="Email">
          <input type="text" id="phone" placeholder="Phone Number">
        </div>

        <div>
          <label for="country">Delivery Information:</label>
          <input type="text" id="country" placeholder="country">
          <input type="text" id="address" placeholder="address">
          <input type="text" id="city" placeholder="city">
          <input type="text" id="state" placeholder="state">
          <div class="name">
            <input type="text" id="first-name" placeholder="first name">
             <input type="text" id="last-name" placeholder="last name">
          </div>
          
        </div>

        <div>
          <label for="card">Payment Information:</label>
          <input type="text" id="card" placeholder="card number">
          
          
        </div>

        
        <input class="pay-now-button" value="PAY NOW" type="submit">
      </form>
    </section>

    <script src="/scripts/handle_purchase.js"></script>
  </body>
    
</html>
